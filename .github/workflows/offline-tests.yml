name: Offline tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Python / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            args: tests/unit
          - suite: integration
            args: tests/integration
          - suite: end-to-end
            args: tests/system
          - suite: existing-suite
            args: tests --ignore=tests/unit --ignore=tests/integration --ignore=tests/system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: typescript-helper/package-lock.json
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e '.[test]'
      - run: npm ci --prefix typescript-helper
      - run: npm run build --prefix typescript-helper
      - name: Run ${{ matrix.suite }} tests
        run: python -m pytest -q ${{ matrix.args }} --junitxml=test-results/${{ matrix.suite }}.xml
      - name: Publish test summary
        if: always()
        run: python scripts/summarize_tests.py test-results/${{ matrix.suite }}.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.suite }}
          path: test-results/*.xml
          if-no-files-found: error
          retention-days: 7
  typescript:
    name: TypeScript / build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: typescript-helper/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix typescript-helper
      - run: npm run build --prefix typescript-helper
      - name: Run TypeScript tests
        working-directory: typescript-helper
        run: |
          mkdir -p ../test-results
          node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=../test-results/typescript.xml test/*.test.cjs
      - name: Publish test summary
        if: always()
        run: python scripts/summarize_tests.py test-results/typescript.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript
          path: test-results/*.xml
          if-no-files-found: error
          retention-days: 7

  sqlite-platforms:
    name: SQLite / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: macos-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q tests/unit/hooks/test_session_store_validation.py tests/test_session_transaction.py --junitxml=test-results/sqlite.xml
      - name: Save SQLite report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-${{ matrix.os }}-${{ matrix.python }}
          path: test-results/*.xml
          if-no-files-found: error
          retention-days: 7
