<rect x="356" y="116" width="272" height="72" rx="12" fill="#141416" stroke="#363840"/><text class="name" x="492.0" y="144" text-anchor="middle">Deterministic tools</text><text class="detail" x="492.0" y="168" text-anchor="middle">Inspect files · extract source</text>
<rect x="200" y="260" width="260" height="72" rx="12" fill="#141416" stroke="#363840"/><text class="name" x="330.0" y="288" text-anchor="middle">Your Python flow</text><text class="detail" x="330.0" y="312" text-anchor="middle">Compose reusable pieces</text>
<rect x="200" y="388" width="260" height="64" rx="12" fill="#141416" stroke="#363840"/><text class="name" x="330.0" y="416" text-anchor="middle">Claude Code plugin</text><text class="detail" x="330.0" y="440" text-anchor="middle">Connect through hook wiring</text>
<rect class="story outline" style="animation-name:pick;opacity:0" x="32" y="116" width="272" height="72" rx="12"/>
<rect class="story outline" style="animation-name:pick;opacity:0" x="356" y="116" width="272" height="72" rx="12"/>
<rect class="story outline" style="animation-name:flowhold;opacity:0" x="200" y="260" width="260" height="72" rx="12"/>
<rect class="story outline" style="animation-name:pluginhold;opacity:0" x="200" y="388" width="260" height="64" rx="12"/>
<!-- @motion:elements -->
  <circle cx="168" cy="188" r="4" fill="#4CF490" class="pkt" style="animation-name:question"/>
  <circle cx="280" cy="260" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:question-ring"/>
  <rect x="200" y="260" width="260" height="72" rx="6" fill="#4CF490" class="glow" style="animation-name:question-glow"/>
  <circle cx="492" cy="188" r="4" fill="#4CF490" class="pkt" style="animation-name:tool"/>
  <circle cx="380" cy="260" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:tool-ring"/>
  <circle cx="328" cy="332" r="4" fill="#4CF490" class="pkt" style="animation-name:connect"/>
  <circle cx="328" cy="388" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:connect-ring"/>
  <rect x="200" y="388" width="260" height="64" rx="6" fill="#4CF490" class="glow" style="animation-name:connect-glow"/>
  <text class="act story" x="328" y="92" text-anchor="middle" fill="#4CF490" style="animation-name:caption0;opacity:0">Choose reusable pieces</text>
  <text class="act story" x="328" y="92" text-anchor="middle" fill="#4CF490" style="animation-name:caption1;opacity:0">Compose your flow</text>
  <text class="act story" x="328" y="92" text-anchor="middle" fill="#4CF490" style="animation-name:caption2;opacity:0">Connect it to Claude Code</text>
  <!-- @/motion:elements -->
