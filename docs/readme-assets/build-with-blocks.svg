<svg xmlns="http://www.w3.org/2000/svg" width="660" height="500" viewBox="0 0 660 500" fill="none" role="img" aria-label="Composition overview: reusable Laya question blocks and deterministic tools combine into a Python flow, which connects to Claude Code through explicit plugin hook wiring. This illustrates authoring, not parallel runtime execution."><title>Build with blocks</title><style>
    /* ---- type ramp (dark skin) --------------------------------------- */
    text { font-family: 'Source Code Pro', ui-monospace, Menlo, Consolas, monospace; }
    .t-title { font-size: 17px; font-weight: 700; letter-spacing: 2px; fill: #F4F6FC; }
    .t-sub   { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 13px; fill: #6F7987; }
    .t-zone  { font-size: 9px; letter-spacing: 1.5px; fill: #6F7987; }
    .t-name  { font-size: 9px; letter-spacing: 1px; fill: #B6C0CF; }
    .t-small { font-size: 8px; letter-spacing: 1px; fill: #6F7987; }
    .t-desc  { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 8.5px; fill: #6F7987; }
    .t-tag   { font-size: 7.5px; font-weight: 600; letter-spacing: 1px; }
    .t-prose { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 10px; fill: #6F7987; }
    .t-badge { font-size: 8.5px; font-weight: 600; letter-spacing: 1px; fill: #A880FF; }

    /* ---- motion base classes ----------------------------------------- */
    .pkt   { animation-timing-function: linear; animation-iteration-count: infinite; }
    .story { animation-timing-function: linear; animation-iteration-count: infinite; }
    .ring  { transform-box: fill-box; transform-origin: center; opacity: 0;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .glow  { opacity: 0; animation-timing-function: linear; animation-iteration-count: infinite; }
    .bar   { transform-box: fill-box; transform-origin: left;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .tick  { animation: tick 2.6s ease-in-out infinite; }
    @keyframes tick { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* @motion:css */
    /* generated by timeline.py — loop 8s — edit the spec, not this block */
    .story, .pkt, .ring, .glow, .bar { animation-duration: 8s; }
    /* pick: show */
    @keyframes pick { 0%, 1.25% { opacity: 0; } 2.5%, 30% { opacity: 1; } 31.25%, 100% { opacity: 0; } }
    /* flowhold: show */
    @keyframes flowhold { 0%, 23.75% { opacity: 0; } 25%, 57.5% { opacity: 1; } 58.75%, 100% { opacity: 0; } }
    /* pluginhold: show */
    @keyframes pluginhold { 0%, 52.5% { opacity: 0; } 53.75%, 80% { opacity: 1; } 81.25%, 100% { opacity: 0; } }
    /* question: Compose the question block into a flow */
    @keyframes question {
      0%, 12.5% { transform: translate(0, 0); opacity: 0; }
      13.25% { opacity: 1; }
      14.95% { transform: translate(0px, 36px); }
      22.55% { transform: translate(112px, 36px); }
      25% { transform: translate(112px, 72px); opacity: 1; }
      26.5%, 100% { transform: translate(112px, 72px); opacity: 0; }
    }
    @keyframes question-ring { 0%, 25% { transform: scale(0.4); opacity: 0; } 25.5% { transform: scale(0.5); opacity: 0.8; } 31.25%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes question-glow { 0%, 25% { opacity: 0; } 26% { opacity: 0.3; } 30%, 100% { opacity: 0; } }
    /* tool: Compose the deterministic tool into the same flow */
    @keyframes tool {
      0%, 12.5% { transform: translate(0, 0); opacity: 0; }
      13.25% { opacity: 1; }
      14.95% { transform: translate(0px, 36px); }
      22.55% { transform: translate(-112px, 36px); }
      25% { transform: translate(-112px, 72px); opacity: 1; }
      26.5%, 100% { transform: translate(-112px, 72px); opacity: 0; }
    }
    @keyframes tool-ring { 0%, 25% { transform: scale(0.4); opacity: 0; } 25.5% { transform: scale(0.5); opacity: 0.8; } 31.25%, 100% { transform: scale(1.4); opacity: 0; } }
    /* connect: Connect the flow through plugin hook wiring */
    @keyframes connect {
      0%, 43.75% { transform: translate(0, 0); opacity: 0; }
      44.5% { opacity: 1; }
      53.75% { transform: translate(0px, 56px); opacity: 1; }
      55.25%, 100% { transform: translate(0px, 56px); opacity: 0; }
    }
    @keyframes connect-ring { 0%, 53.75% { transform: scale(0.4); opacity: 0; } 54.25% { transform: scale(0.5); opacity: 0.8; } 60%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes connect-glow { 0%, 53.75% { opacity: 0; } 54.75% { opacity: 0.3; } 58.75%, 100% { opacity: 0; } }
    /* caption0: phase */
    @keyframes caption0 { 0%, 0% { opacity: 0; } 1.25%, 30% { opacity: 1; } 31.25%, 100% { opacity: 0; } }
    /* caption1: phase */
    @keyframes caption1 { 0%, 30% { opacity: 0; } 31.25%, 56.25% { opacity: 1; } 57.5%, 100% { opacity: 0; } }
    /* caption2: phase */
    @keyframes caption2 { 0%, 56.25% { opacity: 0; } 57.5%, 81.25% { opacity: 1; } 82.5%, 100% { opacity: 0; } }
    /* @/motion:css */

    @media (prefers-reduced-motion: reduce) {
      .pkt, .ring, .glow { animation: none !important; visibility: hidden; }
      .story { animation: none !important; }
      text.story { visibility: hidden; }      /* stacked captions would overprint */
      .bar   { animation: none !important; transform: scaleX(1); }
      .tick  { animation: none !important; }
    }
  
.name{font:18px Arial,sans-serif;fill:#F4F6FC}.detail{font:13px Arial,sans-serif;fill:#B6C0CF}.act{font:14px Arial,sans-serif;font-weight:600}.outline{fill:none;stroke:#4CF490;stroke-width:2}</style>
