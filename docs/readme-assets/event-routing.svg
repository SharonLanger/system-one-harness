    .t-tag   { font-size: 13px; font-weight: 600; letter-spacing: 1px; }
    .t-prose { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 10px; fill: #6F7987; }
    .t-badge { font-size: 8.5px; font-weight: 600; letter-spacing: 1px; fill: #A880FF; }

    /* ---- motion base classes ----------------------------------------- */
    .pkt   { animation-timing-function: linear; animation-iteration-count: infinite; }
    .story { animation-timing-function: linear; animation-iteration-count: infinite; }
    .ring  { transform-box: fill-box; transform-origin: center; opacity: 0;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .glow  { opacity: 0; animation-timing-function: linear; animation-iteration-count: infinite; }
    .bar   { transform-box: fill-box; transform-origin: left;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .tick  { animation: tick 2.6s ease-in-out infinite; }
    @keyframes tick { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* @motion:css */
    /* generated by timeline.py — loop 12s — edit the spec, not this block */
    .story, .pkt, .ring, .glow, .bar { animation-duration: 12s; }
    /* in1: Event 1 reaches the dispatcher */
    @keyframes in1 {
      0%, 2.5% { transform: translate(0, 0); opacity: 0; }
      3% { opacity: 1; }
      7.5% { transform: translate(0px, 44px); opacity: 1; }
      8.5%, 100% { transform: translate(0px, 44px); opacity: 0; }
    }
    @keyframes in1-ring { 0%, 7.5% { transform: scale(0.4); opacity: 0; } 7.83% { transform: scale(0.5); opacity: 0.8; } 11.67%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes in1-glow { 0%, 7.5% { opacity: 0; } 8.17% { opacity: 0.3; } 10.83%, 100% { opacity: 0; } }
    /* out1A: Event 1 activates flow A */
    @keyframes out1A {
      0%, 10% { transform: translate(0, 0); opacity: 0; }
      10.5% { opacity: 1; }
      10.64% { transform: translate(0px, 24px); }
      14.15% { transform: translate(-132px, 24px); }
      15% { transform: translate(-132px, 56px); opacity: 1; }
      16%, 100% { transform: translate(-132px, 56px); opacity: 0; }
    }
    @keyframes out1A-ring { 0%, 15% { transform: scale(0.4); opacity: 0; } 15.33% { transform: scale(0.5); opacity: 0.8; } 19.17%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes out1A-glow { 0%, 15% { opacity: 0; } 15.67% { opacity: 0.3; } 18.33%, 100% { opacity: 0; } }
    /* phase1: phase */
    @keyframes phase1 { 0%, 0% { opacity: 0; } 0.83%, 24.17% { opacity: 1; } 25%, 100% { opacity: 0; } }
    /* route1: show */
    @keyframes route1 { 0%, 8.75% { opacity: 0; } 9.58%, 20% { opacity: 1; } 20.83%, 100% { opacity: 0; } }
    /* in2: Event 2 reaches the dispatcher */
    @keyframes in2 {
      0%, 31.67% { transform: translate(0, 0); opacity: 0; }
      32.17% { opacity: 1; }
      36.67% { transform: translate(0px, 44px); opacity: 1; }
