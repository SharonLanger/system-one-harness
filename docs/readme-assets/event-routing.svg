    @keyframes in2-glow { 0%, 36.67% { opacity: 0; } 37.33% { opacity: 0.3; } 40%, 100% { opacity: 0; } }
    /* out2B: Event 2 activates flow B */
    @keyframes out2B {
      0%, 39.17% { transform: translate(0, 0); opacity: 0; }
      39.67% { opacity: 1; }
      39.79% { transform: translate(0px, 24px); }
      43.33% { transform: translate(136px, 24px); }
      44.17% { transform: translate(136px, 56px); opacity: 1; }
      45.17%, 100% { transform: translate(136px, 56px); opacity: 0; }
    }
    @keyframes out2B-ring { 0%, 44.17% { transform: scale(0.4); opacity: 0; } 44.5% { transform: scale(0.5); opacity: 0.8; } 48.33%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes out2B-glow { 0%, 44.17% { opacity: 0; } 44.83% { opacity: 0.3; } 47.5%, 100% { opacity: 0; } }
    /* phase2: phase */
    @keyframes phase2 { 0%, 29.17% { opacity: 0; } 30%, 53.33% { opacity: 1; } 54.17%, 100% { opacity: 0; } }
    /* route2: show */
    @keyframes route2 { 0%, 37.92% { opacity: 0; } 38.75%, 49.17% { opacity: 1; } 50%, 100% { opacity: 0; } }
    /* in3: Event 3 reaches the dispatcher */
    @keyframes in3 {
      0%, 60.83% { transform: translate(0, 0); opacity: 0; }
      61.33% { opacity: 1; }
      65.83% { transform: translate(0px, 44px); opacity: 1; }
      66.83%, 100% { transform: translate(0px, 44px); opacity: 0; }
    }
    @keyframes in3-ring { 0%, 65.83% { transform: scale(0.4); opacity: 0; } 66.17% { transform: scale(0.5); opacity: 0.8; } 70%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes in3-glow { 0%, 65.83% { opacity: 0; } 66.5% { opacity: 0.3; } 69.17%, 100% { opacity: 0; } }
    /* out3A: Event 3 activates flow A concurrently */
    @keyframes out3A {
      0%, 68.33% { transform: translate(0, 0); opacity: 0; }
      68.83% { opacity: 1; }
      68.97% { transform: translate(0px, 24px); }
      72.48% { transform: translate(-132px, 24px); }
      73.33% { transform: translate(-132px, 56px); opacity: 1; }
      74.33%, 100% { transform: translate(-132px, 56px); opacity: 0; }
    }
    @keyframes out3A-ring { 0%, 73.33% { transform: scale(0.4); opacity: 0; } 73.67% { transform: scale(0.5); opacity: 0.8; } 77.5%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes out3A-glow { 0%, 73.33% { opacity: 0; } 74% { opacity: 0.3; } 76.67%, 100% { opacity: 0; } }
    /* out3B: Event 3 activates flow B concurrently */
    @keyframes out3B {
      0%, 68.33% { transform: translate(0, 0); opacity: 0; }
      68.83% { opacity: 1; }
      68.96% { transform: translate(0px, 24px); }
      72.5% { transform: translate(136px, 24px); }
      73.33% { transform: translate(136px, 56px); opacity: 1; }
      74.33%, 100% { transform: translate(136px, 56px); opacity: 0; }
    }
    @keyframes out3B-ring { 0%, 73.33% { transform: scale(0.4); opacity: 0; } 73.67% { transform: scale(0.5); opacity: 0.8; } 77.5%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes out3B-glow { 0%, 73.33% { opacity: 0; } 74% { opacity: 0.3; } 76.67%, 100% { opacity: 0; } }
    /* phase3: phase */
    @keyframes phase3 { 0%, 58.33% { opacity: 0; } 59.17%, 82.5% { opacity: 1; } 83.33%, 100% { opacity: 0; } }
    /* route3: show */
    @keyframes route3 { 0%, 67.08% { opacity: 0; } 67.92%, 78.33% { opacity: 1; } 79.17%, 100% { opacity: 0; } }
    /* @/motion:css */

    @media (prefers-reduced-motion: reduce) {
      .pkt, .ring, .glow { animation: none !important; visibility: hidden; }
      .story { animation: none !important; }
      text.story { visibility: hidden; }      /* stacked captions would overprint */
      .bar   { animation: none !important; transform: scaleX(1); }
      .tick  { animation: none !important; }
    }
