<svg xmlns="http://www.w3.org/2000/svg" width="660" height="500" viewBox="0 0 660 500" fill="none" role="img" aria-label="Planned routing: Event 1 activates only Flow A; Event 2 activates only Flow B; Event 3 activates both concurrently. Inactive routes stay gray."><title>Event routing — planned capability</title><style>
    /* ---- type ramp (dark skin) --------------------------------------- */
    text { font-family: 'Source Code Pro', ui-monospace, Menlo, Consolas, monospace; }
    .t-title { font-size: 17px; font-weight: 700; letter-spacing: 2px; fill: #F4F6FC; }
